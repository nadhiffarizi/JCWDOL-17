<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <table class="table">
        <tr>
            <th>No.</th>
            <th style="width: 20%;">Image</th>
            <th>Name</th>
            <th>Food</th>
            <th style="width: 20%;">Group</th>
        </tr>
        <tr>
            <td>
                1
            </td>
            <td>
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/Siam_lilacpoint.jpg" 
                alt="cat" class="img-data">
            </td>
            <td>Smiling <sup>Cat</sup> </td>
            <td>Healthy <sub>Fish</sub> </td>
            <td>
                <input type="radio" name="1" id="1" checked> <label for="1">Vertebrate</label>
                <input type="radio" name="1" id="1"> <label for="1">Invertebrate</label>
            </td>
        </tr>
        <tr>
            <td>
                2
            </td>
            <td>
                <img src="https://d.newsweek.com/en/full/1905075/file-photo-smiling-dog.jpg?w=1600&h=900&q=88&f=e38d5081fa14194ff4d46550d61983f5" 
                alt="cat" class="img-data">
            </td>
            <td>Happy<sup>Dog</sup> </td>
            <td>Fresh <sub>Meat</sub> </td>
            <td>
                <input type="radio" name="2" id="2" checked ="checked"> <label for="2">Vertebrate</label>
                <input type="radio" name="2" id="2"> <label for="2">Invertebrate</label>
            </td>
        </tr>

        <tr>
            <td>
                3
            </td>
            <td>
                <img src="https://images.tagesschau.de/image/503bee0c-55b9-4e36-86c8-9f8d5a7a3edf/AAABjH2qH0E/AAABkZLoaiw/1x1-840/schimpanse-106.jpg" 
                alt="cat" class="img-data">
            </td>
            <td>Confuse <sup>Simpanse</sup> </td>
            <td>Sweet <sub>Banana</sub> </td>
            <td>
                <input type="radio" name="3" id="3" checked ="checked"> <label for="3">Vertebrate</label>
                <input type="radio" name="3" id="3"> <label for="3">Invertebrate</label>
            </td>
        </tr>

        <tr>
            <td>
                4
            </td>
            <td>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Jelly_cc11.jpg/640px-Jelly_cc11.jpg" 
                alt="cat" class="img-data">
            </td>
            <td>Frisky <sup>Jellyfish</sup> </td>
            <td>Saltwater <sub>Plankton</sub> </td>
            <td>
                <input type="radio" name="4" id="4"> <label for="4">Vertebrate</label>
                <input type="radio" name="4" id="4" checked ="checked"> <label for="4">Invertebrate</label>
            </td>
        </tr>

        <tr>
            <td>
                5
            </td>
            <td>
                <img src="https://cdn.divessi.com/cached/blog/Wildlife_Squid_Shutterstock_DiveIvanov-Kopie.jpg/1000.jpg" 
                alt="cat" class="img-data">
            </td>
            <td>Swimming <sup>Squad</sup> </td>
            <td>Small <sub>Fish</sub> </td>
            <td>
                <input type="radio" name="5" id="5" > <label for="5">Vertebrate</label>
                <input type="radio" name="5" id="5" checked ="checked"> <label for="5">Invertebrate</label>
            </td>
        </tr>
    </table>
</body>
</html>
